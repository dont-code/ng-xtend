<h1 class="text-2xl">Testing Editor</h1>
@let mainForm=simpleForm();

<form [formGroup]="mainForm">
    <xt-render-sub [context]="simpleContext()" ></xt-render-sub>
</form>
<div style="margin-top:2em">
  Form Value is
  <div class="displayForm" [innerHTML]="formValue() | markdown">
  </div>
  , Form is {{mainForm.pristine?"pristine":"Dirty"}}
</div>
<div style="margin-top:2em">
  Inline display: <xt-render-sub [context]="inlineContext()"></xt-render-sub>
</div>
<div style="margin-top:2em">
  Full view display:<br/>
  <xt-render-sub [context]="fullviewContext()"></xt-render-sub>
</div>
