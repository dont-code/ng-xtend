@if (isInForm() ) {
  <div class="editorContainer">
    <div #editor [formGroup]="formGroup()">
    </div>
  </div>
} @else {
  @let toDisplay=displayValue();
  @if (toDisplay!=null) {
    @if (context().displayMode=='FULL_VIEW') {
      <div class="displayForm" [innerHTML]="displayValue() | markdown">
      </div>
    } @else {
      <span [pTooltip]="fullText">{{ toDisplay | inlineMarkdown}}</span>
      <ng-template #fullText>
        <div class="toolTip" [innerHTML]="displayValue() | markdown">
        </div>
      </ng-template>
    }
  }
}
